{% extends "base.html" %}
{% block title %}Editar Ticket{% endblock %}
{% block heading %}Editar Ticket {{ ticket.num_ticket }}{% endblock %}
{% block breadcrumb %}Modificar datos del ticket{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <i class="fas fa-edit me-2" style="color: var(--primary);"></i> Editar Ticket
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">N° Ticket</label>
                            <input class="form-control" value="{{ ticket.num_ticket }}" readonly>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Cliente</label>
                            <input class="form-control" value="{{ ticket.cliente }}" readonly>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Fecha</label>
                            <input class="form-control" value="{{ ticket.fecha.strftime('%d/%m/%Y') if ticket.fecha else '' }}" readonly>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nodo</label>
                            <select name="nodo" class="form-select">
                                <option value="">-- Seleccione --</option>
                                {% for n in nodos %}
                                <option value="{{ n }}" {% if ticket.nodo == n %}selected{% endif %}>{{ n }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Motivo de Ticket</label>
                            <select name="motivo_ticket" class="form-select">
                                <option value="">-- Seleccione --</option>
                                {% for m in motivos %}
                                <option value="{{ m }}" {% if ticket.motivo_ticket == m %}selected{% endif %}>{{ m }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Visita Técnica</label>
                            <select name="visita_tecnica" class="form-select">
                                <option value="">-- Seleccione --</option>
                                <option value="Sí" {% if ticket.visita_tecnica == 'Sí' %}selected{% endif %}>Sí</option>
                                <option value="No" {% if ticket.visita_tecnica == 'No' %}selected{% endif %}>No</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Tipo de Falla</label>
                            <select name="tipo_falla" class="form-select">
                                <option value="">-- Seleccione --</option>
                                {% for t in tipos_falla %}
                                <option value="{{ t }}" {% if ticket.tipo_falla == t %}selected{% endif %}>{{ t }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Departamento</label>
                            <input name="departamento" class="form-control" value="{{ ticket.departamento or '' }}">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Status</label>
                            <select name="status" class="form-select">
                                <option value="">-- Seleccione --</option>
                                {% for e in estados %}
                                <option value="{{ e }}" {% if ticket.status == e %}selected{% endif %}>{{ e }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Responsable</label>
                            <select name="responsable" class="form-select">
                                <option value="">-- Seleccione --</option>
                                {% for r in responsables %}
                                <option value="{{ r }}" {% if ticket.responsable == r %}selected{% endif %}>{{ r }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Observaciones</label>
                        <textarea name="observaciones" class="form-control" rows="3">{{ ticket.observaciones or '' }}</textarea>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('detalle_ticket', ticket_id=ticket.id) }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-amarillo">
                            <i class="fas fa-save"></i> Guardar Cambios
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
